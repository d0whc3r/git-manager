[project]
name = "git-manager"
version = "0.1.0"
description = "TUI to scan a folder tree for git repositories and sync them with their default branch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

[project.scripts]
git-manager = "git_manager.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_manager"]

[tool.semantic_release]
# Conventional Commits since the last tag decide the bump: feat -> minor, fix -> patch,
# BREAKING CHANGE -> major. Anything else (docs, chore, ci) bumps nothing and cuts no release.
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/git_manager/__init__.py:__version__"]
# [skip ci] keeps the release commit from re-triggering the workflow.
commit_message = "chore(release): v{version} [skip ci]"
# Pre-1.0: keep releasing 0.x instead of jumping to 1.0.0 on the first tag or a breaking change.
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "^main$"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes: undefined names, unused imports
  "I",        # import sorting
  "N",        # PEP 8 naming
  "UP",       # rewrite to modern syntax for our minimum Python
  "B",        # bugbear: likely bugs, e.g. mutable defaults, loop-variable capture
  "A",        # do not shadow builtins
  "C4",       # comprehension style
  "C90",      # mccabe complexity
  "SIM",      # simplifiable code
  "RET",      # return-statement hygiene
  "PIE",      # misc lints
  "PERF",     # avoidable slow patterns
  "FURB",     # modernisation
  "PTH",      # use pathlib, not os.path
  "S",        # bandit: security footguns
  "T20",      # no stray print()
  "ARG",      # unused arguments
  "SLF",      # no reaching into another object's private members
  "TRY",      # exception-handling antipatterns
  "EM",       # readable exception messages
  "LOG", "G", # logging correctness
  "DTZ",      # timezone-aware datetimes
  "Q",        # quote consistency
  "ISC",      # implicit string concatenation
  "TC",       # keep typing-only imports out of runtime
  "INP",      # no implicit namespace packages
  "PGH",      # no blanket noqa / type: ignore
  "RUF",      # ruff's own lints
]
ignore = [
  "ISC001",   # conflicts with the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["git_manager", "conftest"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests assert and shell out to git on purpose, and a pytest fixture is "unused" by design.
"tests/**" = ["S101", "S603", "S607", "ARG001"]
# A CLI entry point prints to stdout.
"src/git_manager/__main__.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/git_manager"]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_also = [
  "if __name__ == .__main__.:",
]
