name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ENTRY: src/git_manager/__main__.py

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      tag: ${{ steps.next.outputs.new_tag }}
      version: ${{ steps.next.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Reads the Conventional Commits since the last tag: feat -> minor, fix -> patch,
      # BREAKING CHANGE -> major. default_bump false means anything else (docs, chore, ci)
      # leaves the outputs empty and no release is cut.
      - id: next
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          dry_run: true
      - name: Bump, commit and tag
        if: steps.next.outputs.new_version
        env:
          VERSION: ${{ steps.next.outputs.new_version }}
          TAG: ${{ steps.next.outputs.new_tag }}
        run: |
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" src/git_manager/__init__.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # [skip ci] keeps this push from re-triggering the workflow.
          git commit -am "chore(release): $VERSION [skip ci]"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: git-manager-linux-x86_64 }
          - { os: windows-latest, name: git-manager-windows-x86_64.exe }
          - { os: macos-latest,   name: git-manager-macos-arm64 }
          - { os: macos-13,       name: git-manager-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.sha }}
      - uses: astral-sh/setup-uv@v5
      - name: Build
        shell: bash
        run: uv run pyinstaller --onefile --name git-manager --collect-all textual --paths src "$ENTRY"
      - name: Rename
        shell: bash
        run: mv dist/git-manager* "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: [version, build]
    if: needs.version.outputs.tag
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*
