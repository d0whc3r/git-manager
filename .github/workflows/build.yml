name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  version:
    needs: test
    runs-on: ubuntu-latest
    concurrency: release
    permissions: { contents: write }
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Reads the Conventional Commits since the last tag, bumps the version in pyproject.toml
      # and __init__.py, writes CHANGELOG.md, then commits, tags and opens the GitHub release.
      # The rules live in [tool.semantic_release] in pyproject.toml.
      - id: release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Every binary is cross-compiled on Linux by scripts/build-binaries.sh, which carries the
  # PyApp and cargo-zigbuild details.
  #
  # One job builds all four and publishes them itself. A matrix would need upload-artifact
  # to hand the files to a release job, and those artifacts cost storage we do not have.
  # Without a release there is nothing to publish, so the build is skipped entirely.
  release:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build the wheel to embed
        run: uv build --wheel
      # Everything the cross-build downloads or compiles that does not change between
      # releases: the crates PyApp depends on, their compiled artifacts, and the ziglang
      # wheel. The key is deliberately exact with no restore-keys, so the entry is written
      # once and then only read — PyApp is pinned, so a stale-but-matching cache is the
      # point. Editing either file rebuilds it from scratch.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pip
            pyapp/target
          key: pyapp-${{ runner.os }}-${{ hashFiles('scripts/build-binaries.sh', '.github/workflows/build.yml') }}
      - name: Install the cross toolchain
        run: |
          pip install --break-system-packages cargo-zigbuild ziglang
          rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu \
            aarch64-apple-darwin x86_64-apple-darwin
      - name: Build every target
        run: ./scripts/build-binaries.sh
      # The runner can only execute the one target that matches it.
      - name: Smoke test
        run: ./dist/git-manager-linux-x86_64 --version
      # python-semantic-release already published the release notes; only the binaries,
      # which it cannot build, are still missing from the release.
      - name: Attach the binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist/git-manager-*
