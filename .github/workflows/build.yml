name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ENTRY: src/git_manager/__main__.py

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tests/test_git.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: git-manager-linux-x86_64 }
          - { os: windows-latest, name: git-manager-windows-x86_64.exe }
          - { os: macos-latest,   name: git-manager-macos-arm64 }
          - { os: macos-13,       name: git-manager-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        shell: bash
        run: uv run pyinstaller --onefile --name git-manager --collect-all textual --paths src "$ENTRY"
      - name: Rename
        shell: bash
        run: mv dist/git-manager* "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
